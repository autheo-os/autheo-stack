<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1200 660" role="img" aria-labelledby="title description">
  <title id="title">The Autheo Stack: a map from hosted work to verifiable proof</title>
  <desc id="description">At the top, an agent environment with scoped identity and AssetTrack with shipment custody. Below are MCP tools and a proposed Layer 1 verification and settlement rail. Layer 0 hosting supports all of them. Dotted connections show intended proof handoffs, not live automatic integrations.</desc>
  <defs>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#517e5d" stroke-width=".45" opacity=".45"/><circle cx="0" cy="0" r="1" fill="#84ad76" opacity=".4"/></pattern>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#1a3a2a"/><stop offset="1" stop-color="#0c211a"/></linearGradient>
    <linearGradient id="base" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#bff777"/><stop offset="1" stop-color="#83dba6"/></linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="7"/></filter>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4 0 8" fill="none" stroke="#b8f876" stroke-width="1.2"/></marker>
  </defs>
  <rect width="1200" height="660" fill="url(#grid)"/>
  <g fill="none" stroke="#608b67" stroke-width="1.4" opacity=".65"><path d="M313 223v77"/><path d="M887 223v77"/><path d="M313 450v76"/><path d="M887 450v76"/></g>
  <g fill="none" stroke="#b8f876" stroke-width="1.5" stroke-dasharray="5 6" marker-end="url(#arrow)"><path d="M559 373h79"/><path d="M710 223c-10 41-53 48-53 84"/><path d="M1094 227c66 53 71 193 0 250-34 29-108 20-117 49"/></g>
  <circle cx="598" cy="373" r="13" fill="#c3fa70" opacity=".55" filter="url(#glow)"/>
  <circle cx="598" cy="373" r="7" fill="#baf77d" stroke="#103c27" stroke-width="2"/>
  <g fill="#abcbad" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="10" letter-spacing="1.5"><text x="330" y="266">SCOPED REQUESTS ↓</text><text x="894" y="266">CUSTODY PROOFS ↓</text><text x="565" y="358">READS / PROOFS →</text><text x="87" y="490">HOSTED ON ↓</text></g>
  <circle cx="313" cy="260" r="4" fill="#bcf675"/><circle cx="887" cy="260" r="4" fill="#bcf675"/><circle cx="313" cy="488" r="4" fill="#bcf675"/><circle cx="887" cy="488" r="4" fill="#bcf675"/>
