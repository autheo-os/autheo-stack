    <g transform="translate(70 302)"><rect width="485" height="148" rx="3" fill="url(#panel)" stroke="#719373"/><rect width="4" height="148" fill="#b7f596"/><text x="25" y="29" fill="#a4c8af" font-size="11" font-weight="700" letter-spacing="2">03 / AGENT INTERFACE</text><text x="25" y="75" fill="#eff8e7" font-size="26" font-weight="650" letter-spacing="-.8">MCP server</text><text x="25" y="105" fill="#b6d5bb" font-size="14">Agent-accessible tools · bounded reads</text><text x="25" y="130" fill="#b1e2a4" font-size="11" font-weight="700" letter-spacing="1">CONFIGURED PROTOTYPE</text><g transform="translate(391 39)" stroke="#bafa83" stroke-width="1.5" fill="none"><rect x="0" y="0" width="32" height="27" rx="2"/><rect x="37" y="23" width="32" height="27" rx="2"/><path d="M32 14h16v9M21 27v36h28V50"/></g></g>
    <g transform="translate(645 302)"><rect width="485" height="148" rx="3" fill="url(#panel)" stroke="#719373"/><rect width="4" height="148" fill="#c3fa70"/><text x="25" y="29" fill="#a4c8af" font-size="11" font-weight="700" letter-spacing="2">02 / PROOF RAIL</text><text x="25" y="75" fill="#eff8e7" font-size="26" font-weight="650" letter-spacing="-.8">Layer 1</text><text x="25" y="105" fill="#b6d5bb" font-size="14">Verification · conditional token settlement</text><text x="25" y="130" fill="#c3fa70" font-size="11" font-weight="700" letter-spacing="1">INTEGRATION VISION</text><g transform="translate(397 33)" fill="none" stroke="#c3fa70" stroke-width="1.4"><path d="m0 22 22-22 22 22-22 22ZM22 44l22 22-22 22L0 66Z"/><circle cx="22" cy="44" r="4" fill="#c3fa70"/></g></g>
    <g transform="translate(70 526)"><rect width="1060" height="90" rx="3" fill="#bff48c"/><text x="25" y="25" fill="#234735" font-size="11" font-weight="800" letter-spacing="2">01 / THE FOUNDATION</text><text x="25" y="61" fill="#10281c" font-size="27" font-weight="700" letter-spacing="-.7">Layer 0 / DevHub</text><text x="339" y="59" fill="#234735" font-size="15">Distributed hosting · projects · deploys · services</text><g transform="translate(972 21)" stroke="#143b26" stroke-width="1.8" fill="none"><path d="M2 0h40v40H2zM12 9h20v20H12zM42 20h34"/><circle cx="78" cy="20" r="3" fill="#143b26"/></g></g>
