  <g font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="10" fill="#9dbca5" letter-spacing="1"><text x="70" y="47">CONCEPTUAL FLOW / NOT A LIVE TELEMETRY DISPLAY</text><text x="840" y="47">DOTTED = INTENDED INTEGRATION</text><text x="70" y="645">COMPUTE IS THE SUBSTRATE</text><text x="871" y="645">PROOF ≠ PAYMENT</text></g>
